<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoBuddy</title>
    <link rel="stylesheet" href="styles.css?v=20261103i">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <main class="container">
        <!-- Tab Navigation with Filter Button -->
        <div class="tabs-container">
            <div class="tabs">
                <button class="tab-btn active" data-tab="newRatings">New Ratings</button>
                <button class="tab-btn" data-tab="library">Watched</button>
                <button class="tab-btn" data-tab="notSeen">Not seen</button>
            </div>
            <button class="filter-icon-btn" id="filterIconBtn" onclick="toggleFilterPanel()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="6" x2="20" y2="6"></line>
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="18" x2="20" y2="18"></line>
                    <circle cx="7" cy="6" r="2" fill="currentColor"></circle>
                    <circle cx="14" cy="12" r="2" fill="currentColor"></circle>
                    <circle cx="17" cy="18" r="2" fill="currentColor"></circle>
                </svg>
                <span class="filter-badge-icon" id="globalFilterCount"></span>
            </button>
        </div>
        
        <!-- Global Filter Side Panel -->
        <div class="filter-overlay" id="filterOverlay" onclick="toggleFilterPanel()"></div>
        <div class="filter-side-panel" id="filterSidePanel">
            <div class="filter-panel-header">
                <h3>Filters</h3>
                <button class="filter-close-btn" onclick="toggleFilterPanel()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="filter-panel-content" id="filterPanelContent">
                <!-- Filter content will be dynamically populated based on active tab -->
            </div>
        </div>
        
        <!-- Tab Contents -->
        <div class="tab-content">
            <!-- New Ratings (merged Top 5 + Rate Today) -->
            <section id="newRatings" class="tab-pane active">
                <div class="action-bar">
                    <button class="btn-get-picks" id="getNewPicksBtn" onclick="getNewRecommendations()">
                        ✨ Get new picks
                    </button>
                </div>
                
                <div id="newRatingsGrid"></div>
            </section>

            <!-- Watched Tab -->
            <section id="library" class="tab-pane">
                <div id="libraryCount" class="library-count"></div>
                <div id="libraryGrid" class="library-grid"></div>
                
                <!-- Export Link -->
                <div class="export-container">
                    <a href="#" id="exportLink" class="export-link">Export my ratings</a>
                </div>
            </section>

            <!-- Not Seen Tab -->
            <section id="notSeen" class="tab-pane">
                <div id="notSeenCount" class="library-count"></div>
                <div id="notSeenGrid" class="library-grid"></div>
            </section>
        </div>
    </main>

    <footer>
        <p>Built with ❤️ for tracking TV shows • Data powered by IMDb & TVmaze</p>
    </footer>

    <script src="database.js?v=20261103k"></script>
    <script src="app.js?v=20261103k"></script>
</body>
</html>
