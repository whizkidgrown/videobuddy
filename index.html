<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemant's TV Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>📺 Hemant's TV Tracker</h1>
            <button id="exportBtn" class="export-btn">Export My Ratings</button>
        </div>
    </header>

    <main class="container">
        <!-- Today's Batch Section -->
        <section id="todaysBatch" class="section">
            <h2>Today's Batch</h2>
            <p class="section-desc">Rate these 7 shows to help refine your recommendations</p>
            <div id="batchGrid" class="batch-grid"></div>
        </section>

        <!-- Top 5 Picks Section -->
        <section id="topPicks" class="section">
            <h2>Top 5 For You</h2>
            <p class="section-desc">Handpicked based on your taste</p>
            <div id="picksGrid" class="picks-grid"></div>
        </section>

        <!-- My Shows Library Section -->
        <section id="library" class="section">
            <h2>My Shows Library</h2>
            
            <!-- Filters -->
            <div class="filters">
                <div class="filter-group">
                    <label>Filter by Rating:</label>
                    <select id="ratingFilter">
                        <option value="all">All Ratings</option>
                        <option value="loved">Loved</option>
                        <option value="okay">Okay</option>
                        <option value="disliked">Disliked</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>Filter by Status:</label>
                    <select id="statusFilter">
                        <option value="all">All Status</option>
                        <option value="Want to watch">Want to Watch</option>
                        <option value="Watching">Watching</option>
                        <option value="Watched">Watched</option>
                    </select>
                </div>
                
                <div class="filter-group search-group">
                    <label>Search:</label>
                    <input type="text" id="searchInput" placeholder="Search shows...">
                </div>
            </div>

            <div id="libraryCount" class="library-count"></div>
            <div id="libraryGrid" class="library-grid"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Built with ❤️ for tracking TV shows • Data powered by IMDb & TVmaze</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
