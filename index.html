<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemant's TV Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>📺 Hemant's TV Tracker</h1>
        </div>
    </header>

    <main class="container">
        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="topPicks">Top 5 For You</button>
            <button class="tab-btn" data-tab="todaysBatch">Rate Today</button>
            <button class="tab-btn" data-tab="library">Watched</button>
        </div>

        <!-- Tab Contents -->
        <div class="tab-content">
            <!-- Top 5 Picks Tab -->
            <section id="topPicks" class="tab-pane active">
                <h2>Top 5 For You</h2>
                <p class="section-desc">Handpicked based on your taste</p>
                
                <button class="filter-toggle" onclick="toggleFilters('topPicks')">
                    🔍 Filters <span id="topPicksFilterCount" class="filter-count"></span>
                </button>
                
                <div id="topPicksFilters" class="filters">
                    <div class="filter-group">
                        <label>Streaming:</label>
                        <select id="topPicksStreamingFilter" multiple class="multi-select">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>IMDb Rating:</label>
                        <select id="topPicksImdbFilter" multiple class="multi-select">
                            <option value="9+">9.0+</option>
                            <option value="8-9">8.0-8.9</option>
                            <option value="7-8">7.0-7.9</option>
                            <option value="below7">Below 7.0</option>
                        </select>
                    </div>
                    <button class="btn-clear" onclick="clearFilters('topPicks')">Clear Filters</button>
                </div>
                
                <div id="picksGrid" class="picks-grid"></div>
            </section>

            <!-- Today's Batch Tab -->
            <section id="todaysBatch" class="tab-pane">
                <h2>Rate Today</h2>
                <p class="section-desc">Rate these shows - they'll move to Watched once rated</p>
                
                <button class="filter-toggle" onclick="toggleFilters('batch')">
                    🔍 Filters <span id="batchFilterCount" class="filter-count"></span>
                </button>
                
                <div id="batchFilters" class="filters">
                    <div class="filter-group">
                        <label>Streaming:</label>
                        <select id="batchStreamingFilter" multiple class="multi-select">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>IMDb Rating:</label>
                        <select id="batchImdbFilter" multiple class="multi-select">
                            <option value="9+">9.0+</option>
                            <option value="8-9">8.0-8.9</option>
                            <option value="7-8">7.0-7.9</option>
                            <option value="below7">Below 7.0</option>
                        </select>
                    </div>
                    <button class="btn-clear" onclick="clearFilters('batch')">Clear Filters</button>
                </div>
                
                <div id="batchGrid" class="batch-grid"></div>
            </section>

            <!-- My Shows Library Tab -->
            <section id="library" class="tab-pane">
                <h2>Watched</h2>
                
                <button class="filter-toggle" onclick="toggleFilters('library')">
                    🔍 Filters <span id="libraryFilterCount" class="filter-count"></span>
                </button>
                
                <div id="libraryFilters" class="filters">
                    <div class="filter-group">
                        <label>Streaming:</label>
                        <select id="libraryStreamingFilter" multiple class="multi-select">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label>Ratings:</label>
                        <select id="libraryRatingFilter" multiple class="multi-select">
                            <optgroup label="My Rating">
                                <option value="loved">❤️ Loved</option>
                                <option value="okay">👍 Okay</option>
                                <option value="disliked">👎 Disliked</option>
                            </optgroup>
                            <optgroup label="IMDb Rating">
                                <option value="9+">9.0+</option>
                                <option value="8-9">8.0-8.9</option>
                                <option value="7-8">7.0-7.9</option>
                                <option value="below7">Below 7.0</option>
                            </optgroup>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label>Status:</label>
                        <select id="statusFilter" multiple class="multi-select">
                            <option value="Want to watch">📌 Want to Watch</option>
                            <option value="Watching">▶️ Watching</option>
                            <option value="Watched">✅ Watched</option>
                        </select>
                    </div>
                    
                    <div class="filter-group search-group">
                        <label>Search:</label>
                        <input type="text" id="searchInput" placeholder="Search shows...">
                    </div>
                    
                    <button class="btn-clear" onclick="clearFilters('library')">Clear Filters</button>
                </div>

                <div id="libraryCount" class="library-count"></div>
                <div id="libraryGrid" class="library-grid"></div>
                
                <!-- Export Link -->
                <div class="export-container">
                    <a href="#" id="exportLink" class="export-link">Export my ratings</a>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>Built with ❤️ for tracking TV shows • Data powered by IMDb & TVmaze</p>
        </div>
    </footer>

    <script src="database.js"></script>
    <script src="app.js"></script>
</body>
</html>
